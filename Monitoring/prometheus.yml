
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # vLLM metrics through FastAPI gateway
  - job_name: vllm
    metrics_path: /metrics
    scheme: http

    basic_auth:
      username: prabh
      password: prabh

    static_configs:
      - targets: ["host.docker.internal:9100"]
